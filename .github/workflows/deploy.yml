name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Configure Spring Envs

    steps:
      # Step 1: Check out the code
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug secret presence
        env:
            DOCKER_USERNAME: ${{ DOCKER_USERNAME }}
        run: |
            if [ -z "$DOCKER_USERNAME" ]; then
              echo "DOCKER_USERNAME is EMPTY"
            else
              echo "DOCKER_USERNAME is SET"
            fi

      - name: Debug secret presence
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "DOCKER_USERNAME is EMPTY"
          else
            echo "DOCKER_USERNAME is SET"
          fi

      # Step 2: Set up Java environment to run verification if needed
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/springboot-app:latest

      # Step 5: Trigger Deploy on Render
      - name: Deploy to Render
        uses: jorgelnjunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_for_deployment: true
